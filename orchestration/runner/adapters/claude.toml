# 런타임 어댑터 — Anthropic Claude Code CLI (헤드리스 `claude -p`)
#
# 스키마와 추가 절차: adapters/README.md
# 러너 코드에는 런타임 이름 분기가 없다 — 이 파일이 CLI 조립 규칙의 유일한 정의다.
# id 는 roles.json#runtimes 의 키와 일치해야 한다 (harness lint 가 대조).

id = "claude"
description = "Claude Code CLI — 헤드리스 실행. 프로젝트 MCP 를 붙일 수 있는 유일한 런타임."

# 항상 붙는 고정 인자.
base = ["claude", "-p", "--output-format", "json"]

# 프롬프트 전달: stdin (표준입력) | argv (마지막 인자)
prompt_delivery = "stdin"

# 결과 회수: stdout_envelope (stdout JSON 봉투에서 꺼냄) | out_file (CLI 가 파일에 씀)
result = "stdout_envelope"
envelope_result_key = "result"
envelope_cost_key = "total_cost_usd"
# CLI 가 API 오류(크레딧 부족·인증 실패)에도 exit 0 을 낸다 — 종료 코드만 보면 실패를
# 성공으로 오판한다. 이 플래그가 true 면 실패로 판정하고, result 문구를 소진 감지에 넘긴다.
envelope_error_key = "is_error"

# ── 실행 환경 ──
# ANTHROPIC_API_KEY 가 설정돼 있으면 CLI 가 claude.ai 로그인 대신 그 키를 쓴다.
# 키에 크레딧이 없으면 **모든 claude 노드가 "Credit balance is too low" 로 실패**한다
# (2026-08-27 실측: 헤드리스 호출 전량 실패 → 키를 걷어내면 정상 동작).
# 부모 셸의 환경은 건드리지 않는다 — 자식 프로세스에만 적용된다.
[env]
unset = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"]

# 노드가 값을 주지 않았을 때의 기본값.
# 읽기 전용 노드는 dontAsk 로 충분하다. 파일을 쓰는 노드는 roles.json#roles[].exec 가
# 명시한다 (헤드리스에는 승인을 누를 사람이 없다).
# 어느 모드에서도 hooks/ 가드(시크릿·push·파괴적 연산)는 그대로 적용된다.
[defaults]
permission_mode = "dontAsk"

# 노드 키 → argv 조각. 노드에 값이 있을 때만 붙는다.
# 자리표시자: {value} 원값 · {csv} 리스트를 쉼표로 · {root_path} 하네스 루트 기준 경로(존재 검증)
[flags]
model = ["--model", "{value}"]
effort = ["--effort", "{value}"]
permission_mode = ["--permission-mode", "{value}"]
tools = ["--allowedTools", "{csv}"]
# MCP 는 claude 노드만 붙일 수 있다 (codex 는 개인 설정에 별도 등록해야 한다).
# MCP 가 필요한 단계는 claude 노드로 잡고 결과를 파일로 넘긴다.
mcp_config = ["--mcp-config", "{root_path}", "--strict-mcp-config"]

# ── 접근 등급 → 런타임 네이티브 키 ──
# roles.json#roles[].exec.access 가 런타임 중립 등급을 선언하고, 여기서 번역한다.
# 코드에 런타임 분기를 두지 않기 위한 표다 ([failover.translate] 와 같은 원리).
#
# full 이 bypassPermissions 인 이유: acceptEdits 는 Bash 를 샌드박스해 워크스페이스 밖
# 쓰기를 막는다. 빌드 도구(Gradle·npm)는 홈 캐시에 잠금·소켓을 만들어야 하므로 그 모드에서는
# 빌드가 시작조차 못 한다. 테스트를 못 돌리면 "통과" 단언에 근거가 없어 COMPLETION-RULE 위반이다.
# 어느 등급에서도 hooks/ 가드(시크릿·push·파괴적 연산)는 그대로 적용된다.
[access]
read-only = { permission_mode = "dontAsk" }
workspace-write = { permission_mode = "acceptEdits" }
full = { permission_mode = "bypassPermissions" }

# ── 런타임 소진 시 failover ──
# 소진되면 fallback_to 로 **1회만** 재시도한다 (노드당 1 hop — 무한 순환 방지).
# 러너는 이 선언만 보고 동작한다. 런타임 분기 코드는 없다.
#
# 이것은 ADR 0004 의 사전 예산 게이트와 **다른 층**이다. 게이트는 run 시작 전에 막고,
# 여기는 노드가 실제로 죽은 뒤에 넘긴다. 둘 다 필요하다.
[failover]
fallback_to = "codex"
# 대체 런타임의 모델 id. 노드의 model("opus" 등)은 claude 전용이라 그대로 넘길 수 없다.
fallback_model = "gpt-5.6-terra"
# stdout+stderr 에 대해 대소문자 무시로 검사한다.
# 주의: 일시적 rate limit 도 걸린다 — 기다리는 대신 런타임을 바꾸는 선택이다.
exhaustion_patterns = [
  "usage limit reached",
  "rate.?limit",
  "credit balance is too low",
  "insufficient credits",
  "\"status\"\\s*:\\s*429",
  "429 too many requests",
  # 관측 봉투(2026-08-21): 세션 한도는 키가 api_error_status 라 위의 "status":429 가
  # 앞의 " 리터럴 때문에 못 잡고, 문구도 "You've hit your session limit" 이라 다르다.
  # 이 두 줄이 없으면 노드가 한도까지 태우고 대체 런타임 없이 전멸한다.
  "\"api_error_status\"\\s*:\\s*429",
  "hit your (session|usage) limit",
]

# 런타임 전환 시 안전 의미를 잃지 않도록 키·값을 명시 변환한다.
# 여기 없는 미지원 키는 제거되며, 제거 사실은 로그와 journal 에 남는다.
[failover.translate.permission_mode]
dontAsk = { key = "sandbox", value = "read-only" }
acceptEdits = { key = "sandbox", value = "workspace-write" }
# 구현 노드가 쓰는 모드. codex 로 넘어가도 빌드 도구가 홈 캐시를 쓸 수 있어야 한다.
bypassPermissions = { key = "sandbox", value = "danger-full-access" }
